# pyproject.toml

[build-system]
requires = ["setuptools>=75.3.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bib_optimizer"
version = "0.5.2"
description = "Clean and optimize bib file."
authors = [
  { name="Ka Wa Yip", email="yipkawa@gmail.com" },
]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["bibtexparser>=1.4.3,<2"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14"
]
keywords = ["latex", "bib", "bibliography"]

[project.urls]
Homepage = "https://github.com/kwyip/bib_optimizer"
Issues = "https://github.com/kwyip/bib_optimizer/issues"

[dependency-groups]
build = ["build", "twine"]
dev   = ["black>=26.10.1", "isort", "mypy", "pytest>=9.0.3"]

# Tooling needs newer Python; the installed CLI still supports Python >=3.8.
[tool.uv.dependency-groups]
build = { requires-python = ">=3.10" }
dev = { requires-python = ">=3.10" }

# Security floors for transitive tooling dependencies, without adding runtime deps.
[tool.uv]
constraint-dependencies = [
    "urllib3>=2.8.0",
    "cryptography>=50.0.0",
    "requests>=2.33.0",
    "pygments>=2.20.0",
]

[project.scripts]
bibopt = "bib_optimizer.__main__:main"

[tool.bumpver]
current_version = "0.5.2"
version_pattern = "MAJOR.MINOR.PATCH"
commit_message  = "bump version {old_version} -> {new_version}"
commit          = true
tag             = true
push            = false

[tool.bumpver.file_patterns]
"pyproject.toml" = [
    'current_version = "{version}"',
    'version = "{version}"',
]
"src/bib_optimizer/__init__.py" = ["{version}"]
"src/bib_optimizer/__main__.py" = ["- bib_optimizer v{version}"]

[tool.isort]
profile                   = "black"
import_heading_stdlib     = "Standard library imports"
import_heading_thirdparty = "Third party imports"
import_heading_firstparty = "Reader imports"

